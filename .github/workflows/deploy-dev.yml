# .github/workflows/deploy-dev.yml
#
# Deploy the Worker to dt-api-v2-dev on every push to develop.
# Also applies D1 migrations to timeandtimepro-full-v2.
#
# Required secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   - Cloudflare API token (Account: D1:Edit, Workers Scripts:Edit, Account Settings:Read)
#   CLOUDFLARE_ACCOUNT_ID  - Cloudflare account ID (e.g. f0de6c4b68becd81e60507ecf9410199)
#
# Usage: just push to develop. No manual action needed.

name: Deploy to dt-api-v2-dev (manual)

on:
  workflow_dispatch:  # manual trigger only — use Actions UI "Run workflow"
  # NOTE: auto-on-push was removed 2026-08-01. The dev Worker should only be
  # touched intentionally (not on every develop commit). To deploy:
  #   1. Go to https://github.com/nsura2029-art/dateandtime-api-v2/actions
  #   2. Click "Deploy to dt-api-v2-dev (manual)"
  #   3. Click "Run workflow" → "Run workflow"
  # For local deploy: bash scripts/deploy.sh dev

# Cancel in-progress runs if you re-trigger while one is running
concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  deploy:
    name: Apply migrations + deploy Worker
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DB_NAME: timeandtimepro-full-v2
      WRANGLER_ENV: dev
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Wrangler 3 uses CF_API_TOKEN; wrangler 4 uses CLOUDFLARE_API_TOKEN.
      # Set both from the same GitHub Secret so the workflow works on either.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        # Use 'npm install' instead of 'npm ci' because the lock file
        # is sometimes out of sync with package.json (CI environments
        # may have older Node + newer lock). 'npm install' auto-syncs.
        run: npm install --no-audit --no-fund

      - name: Verify wrangler + auth
        run: |
          npx wrangler --version
          npx wrangler whoami

      - name: Apply migration 101 (create schema)
        run: npx wrangler d1 execute "$DB_NAME" --env "$WRANGLER_ENV" --remote --file=migrations/101_create_schema.sql

      - name: Apply migration 102 (seed regions)
        run: npx wrangler d1 execute "$DB_NAME" --env "$WRANGLER_ENV" --remote --file=migrations/102_seed_regions.sql

      - name: Apply migration 103 (seed subregions)
        run: npx wrangler d1 execute "$DB_NAME" --env "$WRANGLER_ENV" --remote --file=migrations/103_seed_subregions.sql

      - name: Apply migration 104 (seed countries)
        run: npx wrangler d1 execute "$DB_NAME" --env "$WRANGLER_ENV" --remote --file=migrations/104_seed_countries.sql

      - name: Apply migration 105 (seed admin regions)
        run: npx wrangler d1 execute "$DB_NAME" --env "$WRANGLER_ENV" --remote --file=migrations/105_seed_admin_regions.sql

      - name: Apply migration 106 (seed time zones)
        run: npx wrangler d1 execute "$DB_NAME" --env "$WRANGLER_ENV" --remote --file=migrations/106_seed_time_zones.sql

      - name: Apply migration 107 (add 71 missing timezones for dr5hn city FK)
        # 71 IANA timezone IDs referenced by dr5hn cities that aren't in the
        # canonical IANA tzdb-2026c list (likely historical aliases + capital
        # IDs). Without this, 92 country files silently FK-fail.
        # Idempotent: uses INSERT OR IGNORE.
        run: npx wrangler d1 execute "$DB_NAME" --env "$WRANGLER_ENV" --remote --file=migrations/107_seed_missing_time_zones.sql

      - name: Apply migration 108 (set capital flags)
        # Sets is_country_capital, is_state_capital, capital_type on cities
        # based on name match with countries.capital and admin_regions.name.
        run: npx wrangler d1 execute "$DB_NAME" --env "$WRANGLER_ENV" --remote --file=migrations/108_set_capital_flags.sql

      - name: Apply migration 109 (add tier column)
        # Adds tier1/tier2/tier3 classification to cities.
        # Idempotent: ALTER TABLE ADD COLUMN with IF NOT EXISTS, UPDATE
        # statements set tier where NULL.
        run: npx wrangler d1 execute "$DB_NAME" --env "$WRANGLER_ENV" --remote --file=migrations/109_add_tier_column.sql

      - name: Apply migration 110 (seed place_names)
        # Seeds 152,970 place_names rows (one per city, English official +
        # ASCII variant). Powers FTS5 search.
        run: npx wrangler d1 execute "$DB_NAME" --env "$WRANGLER_ENV" --remote --file=migrations/110_seed_place_names.sql

      - name: Apply migration 111 (seed GeoNames alt names)
        # Seeds ~452K place_names rows from GeoNames alternateNamesV2.txt
        # (filtered to real ISO 639 language codes). Covers 52K of our cities
        # matched by name+country against cities1000.txt. After applying,
        # search must rebuild FTS5 index (handled in the verify step).
        # Skipped if the file is missing (it's gitignored — see .gitignore).
        run: |
          if [ -f migrations/111_seed_alt_names.sql ]; then
            npx wrangler d1 execute "$DB_NAME" --env "$WRANGLER_ENV" --remote --file=migrations/111_seed_alt_names.sql
            echo "Rebuilding FTS5 index..."
            npx wrangler d1 execute "$DB_NAME" --env "$WRANGLER_ENV" --remote --command="INSERT INTO place_names_fts(place_names_fts) VALUES('rebuild');"
          else
            echo "::notice::migrations/111_seed_alt_names.sql not found, skipping GeoNames alt names seed. To enable, run scripts/seed/alt_names.py locally and commit the file."
          fi

      - name: Apply migration 112 (seed population from GeoNames)
        # 124,561 cities with population from GeoNames cities1000.
        # Idempotent: re-applying overwrites the same values.
        run: npx wrangler d1 execute "$DB_NAME" --env "$WRANGLER_ENV" --remote --file=migrations/112_seed_population.sql

      - name: Apply migration 113 (re-tier by population)
        # Reclassifies tier1 (pop>4M), tier2 (1M-4M + capitals), tier3 (rest).
        # Idempotent: resets tier to NULL first, then re-applies rules.
        run: npx wrangler d1 execute "$DB_NAME" --env "$WRANGLER_ENV" --remote --file=migrations/113_retier_by_population.sql

      - name: Apply migration 114 (state + country capitals from GeoNames)
        # 3,047 state capitals (PPLA) + 199 country capitals (PPLC) from
        # GeoNames cities1000. Idempotent: resets flags then re-applies.
        run: npx wrangler d1 execute "$DB_NAME" --env "$WRANGLER_ENV" --remote --file=migrations/114_set_capitals_from_geonames.sql

      - name: Apply cities (if any .sql files exist)
        run: |
          CITY_COUNT=$(ls migrations/cities/*.sql 2>/dev/null | wc -l)
          if [ "$CITY_COUNT" -lt 200 ]; then
            echo "::warning::Only $CITY_COUNT city files found (expected 223+). Skipping cities apply."
            echo "If you want to apply cities, generate them locally with:"
            echo "  py scripts/seed/107_generate_cities.py"
            echo "Then commit and push the migrations/cities/*.sql files."
            exit 0
          fi

          echo "Cleaning cities table..."
          npx wrangler d1 execute "$DB_NAME" --env "$WRANGLER_ENV" --remote --yes --command="DELETE FROM cities;"

          echo "Applying $CITY_COUNT city files (~5-15 min)..."
          DB_NAME="$DB_NAME" REMOTE=1 bash migrations/cities/run-all.sh

      - name: Verify counts
        run: |
          npx wrangler d1 execute "$DB_NAME" --env "$WRANGLER_ENV" --remote --json --command="
            SELECT 'regions' AS t, COUNT(*) AS n FROM regions
            UNION SELECT 'subregions', COUNT(*) FROM subregions
            UNION SELECT 'countries', COUNT(*) FROM countries
            UNION SELECT 'admin', COUNT(*) FROM administrative_regions
            UNION SELECT 'cities', COUNT(*) FROM cities
            UNION SELECT 'time_zones', COUNT(*) FROM time_zones;"

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --run

      - name: Sync README
        run: npm run sync:readme

      - name: Deploy to dev Worker
        run: npx wrangler deploy --env "$WRANGLER_ENV"

      - name: Smoke test
        run: |
          sleep 5  # give the Worker a moment to start
          curl -sf https://dt-api-v2-dev.nsura2029.workers.dev/api/v1/health > smoke.json
          cat smoke.json
          echo ""
          echo "Smoke test passed!"

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Deployment failed. See logs above."
          echo "Check: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
