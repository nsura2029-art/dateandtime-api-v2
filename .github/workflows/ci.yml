# .github/workflows/ci.yml
#
# Run all 5 automated checks on every PR and push to develop/main.
# Blocks merges if any check fails.
#
# No secrets required — this just runs typecheck, lint, test,
# and readme sync against the in-process app + mocked D1.

name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: All 5 automated checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --run

      - name: Sync README (verify no drift)
        run: |
          # Snapshot the current README state
          cp README.md /tmp/README.before.md
          npm run sync:readme
          # If anything changed, the sync script has a bug
          if ! diff -q README.md /tmp/README.before.md > /dev/null; then
            echo "::error::README.md has drift. Run 'npm run sync:readme' locally and commit."
            exit 1
          fi
          echo "README is in sync."
